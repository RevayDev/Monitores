server {
    listen 80;
    server_name 158.23.59.208;

    client_max_body_size 50M;

    # ── Frontend (React/Vite build) ──────────────────────────────────────
    root /var/www/monitores/frontend/dist;
    index index.html;

    # SPA fallback: all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy to Node.js backend ────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Disable buffering for SSE / real-time
        proxy_buffering off;
    }

    # ── Socket.IO WebSocket support (same proxy, WS upgrade) ────────────
    location /api/socket.io/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        proxy_buffering off;
    }

    # ── Uploaded files (served by backend) ──────────────────────────────
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache static uploads for 1 hour
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # ── Security: deny access to sensitive files ────────────────────────
    location ~ /\.env {
        deny all;
        return 404;
    }

    location ~ /\.git {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ /node_modules {
        deny all;
        return 404;
    }

    location = /package.json {
        deny all;
        return 404;
    }

    location = /package-lock.json {
        deny all;
        return 404;
    }

    # ── Gzip ────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;
}
